[project]
name = "tankbattle"
version = "0.1.0"
description = "TankBattle — a simple Python tank game and library"
requires-python = ">=3.10"

dependencies = [
  "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
